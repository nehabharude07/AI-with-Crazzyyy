{% extends "base.html" %}
{% block title %}Forgot password — AI.WITH CRAZZYYY{% endblock %}

{% block content %}
<section class="page-section auth-section">
  <div class="auth-card">
    <span class="divider-ring"><span class="ring"></span><span class="eyebrow">Reset password</span></span>
    <h1 style="font-size:1.7rem;">Forgot your password?</h1>
    <p style="margin-bottom:1.75rem;">Enter your account email and we'll send you a link to set a new password.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">Send reset link</button>
    </form>

    <p class="auth-switch">Remembered it? <a href="{{ url_for('auth.login') }}">Back to login</a></p>
  </div>
</section>
{% endblock %}
