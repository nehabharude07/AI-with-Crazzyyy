{% extends "base.html" %}
{% block title %}Reset password — AI.WITH CRAZZYYY{% endblock %}

{% block content %}
<section class="page-section auth-section">
  <div class="auth-card">
    <span class="divider-ring"><span class="ring"></span><span class="eyebrow">Almost done</span></span>
    <h1 style="font-size:1.7rem;">Set a new password</h1>
    <p style="margin-bottom:1.75rem;">Choose a strong password you haven't used before.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required autofocus>
        <span class="hint">At least 8 characters, with uppercase, lowercase, a number and a symbol.</span>
      </div>
      <div class="form-field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
